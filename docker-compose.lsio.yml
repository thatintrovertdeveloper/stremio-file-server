# LSIO-style all-in-one run example (uses Dockerfile.alpine / Dockerfile.ubuntu at repo root).
# Build: docker compose -f docker-compose.lsio.yml up --build
services:
  stremio-file-server:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    container_name: stremio-file-server
    ports:
      - "7001:7001"            # addon (avoid 7000: AirPlay blocks it on macOS)
      - "3003:3003"            # direct file/stream access (optional)
    volumes:
      - ${MEDIA_DIR:-./media}:/media:ro
    environment:
      - PUID=1000              # LSIO permission model
      - PGID=1000
      - TZ=Etc/UTC
      - SOURCE_DIR=/media
      - SOURCE_DIRS=${SOURCE_DIRS:-}
      - API_KEY=${API_KEY:-}
      - SUBDL_API_KEY=${SUBDL_API_KEY:-}
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      - OPENSUBTITLES_USERNAME=${OPENSUBTITLES_USERNAME:-}
      - OPENSUBTITLES_PASSWORD=${OPENSUBTITLES_PASSWORD:-}
      - SUBTITLE_LANG=${SUBTITLE_LANG:-eng}
      - SUBTITLE_PROVIDERS=${SUBTITLE_PROVIDERS:-subdl,opensubtitles}
      - SUBTITLE_CACHE_TTL=${SUBTITLE_CACHE_TTL:-86400}
      - FILE_SERVER_URL=${FILE_SERVER_URL:-http://localhost:3003}
      - FILE_SERVER_PUBLIC_URL=${FILE_SERVER_PUBLIC_URL:-http://localhost:3003}
      - FILE_SERVER_API_KEY=${API_KEY:-}
      - TMDB_API_READ_ACCESS_TOKEN=${TMDB_API_READ_ACCESS_TOKEN:-}
      - TMDB_CACHE_TTL=${TMDB_CACHE_TTL:-86400}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-en-US}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
