name: QA

# Runs the critical-flow suite. Also callable from docker-publish.yml so a broken
# contract cannot be published as an image (`uses: ./.github/workflows/qa.yml`).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  critical-flows:
    name: critical-flows (python 3.11 / node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Versions match the runtime images: python:3.11-slim and node:20-alpine.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: file-server/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: addon/package-lock.json

      # ffmpeg is needed twice: to generate fixture media and to make thumbnails.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies and fixtures
        run: bash scripts/qa-setup.sh

      # Starts both services against the fixture library, runs the suite, always
      # tears the services down (process-group kill), and exits non-zero on failure.
      - name: Run critical flow checks
        run: bash scripts/qa-e2e.sh

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-logs
          path: .qa/logs/
          if-no-files-found: ignore
          retention-days: 7
