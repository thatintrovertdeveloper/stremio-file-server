name: Publish Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  # Gate: the same critical-flow suite that runs on pull requests. A red suite
  # stops the image build entirely, so a broken contract cannot be published.
  test:
    uses: ./.github/workflows/qa.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - context: ./file-server
            suffix: ""
            runner: ubuntu-latest
            platform: linux/amd64
          - context: ./file-server
            suffix: ""
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - context: ./addon
            suffix: "-addon"
            runner: ubuntu-latest
            platform: linux/amd64
          - context: ./addon
            suffix: "-addon"
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=ghcr.io/${{ github.repository }}${{ matrix.suffix }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix == '' && 'main' || 'addon' }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - suffix: ""
            artifact: main
          - suffix: "-addon"
            artifact: addon
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.artifact }}-*
          merge-multiple: true

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}${{ matrix.suffix }}@sha256:%s ' *)

  # LinuxServer.io-style all-in-one variants (Dockerfile.alpine / Dockerfile.ubuntu),
  # driven by docker-bake.hcl. Same native-runner rule as above: no QEMU, one arch
  # per runner, digest pushed per arch, manifest merged afterwards.
  lsio-build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: alpine
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - base: alpine
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - base: ubuntu
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - base: ubuntu
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Bake ${{ matrix.base }} for ${{ matrix.platform }}
        env:
          BASE: ${{ matrix.base }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ghcr.io/${{ github.repository }}
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx bake "$BASE" \
            --metadata-file "${{ runner.temp }}/bake-meta.json" \
            --set "$BASE.tags=" \
            --set "$BASE.platform=$PLATFORM" \
            --set "$BASE.args.VERSION=$VERSION" \
            --set "$BASE.args.BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --set "$BASE.output=type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --set "$BASE.cache-from=type=gha,scope=lsio-$BASE" \
            --set "$BASE.cache-to=type=gha,mode=max,scope=lsio-$BASE"

      - name: Export digest
        env:
          BASE: ${{ matrix.base }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]]['containerimage.digest'])" \
            "${{ runner.temp }}/bake-meta.json" "$BASE")
          test -n "$digest"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: lsio-digests-${{ matrix.base }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  lsio-merge:
    runs-on: ubuntu-latest
    needs: lsio-build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        base: [alpine, ubuntu]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: lsio-digests-${{ matrix.base }}-*
          merge-multiple: true

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          BASE: ${{ matrix.base }}
        run: |
          tags="-t $IMAGE:$BASE -t $IMAGE:$BASE-sha-${GITHUB_SHA::7}"
          if [ "$BASE" = "alpine" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$tags -t $IMAGE:lsio-latest"
          fi
          case "${{ github.ref }}" in
            refs/tags/v*) tags="$tags -t $IMAGE:$BASE-${GITHUB_REF_NAME}" ;;
          esac
          docker buildx imagetools create $tags \
            $(printf "$IMAGE@sha256:%s " *)
